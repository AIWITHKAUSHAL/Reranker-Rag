[project]
name = "reranking-rag"
version = "0.1.0"
description = "Live Gemini retrieval, reranking, and grounded generation through EURI"
requires-python = ">=3.11"
dependencies = ["openai>=1.50,<3", "streamlit>=1.45,<2", "numpy>=2,<3", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D", "B", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
